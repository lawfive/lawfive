# Runs a LawFive server with its database: `docker compose up -d`, then open PUBLIC_URL.
# Copy .env.example to .env first and set AUTH_SECRET. This builds the image from the source here;
# to run a published image instead (built by GitHub Actions), set LAWFIVE_IMAGE in .env and run
# `docker compose pull && docker compose up -d`. For use from the watch and phone apps the
# server must be reachable over HTTPS with a valid certificate (put a reverse proxy in front).

services:
  server:
    image: ${LAWFIVE_IMAGE:-lawfive-server}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://lawfive:${POSTGRES_PASSWORD:-lawfive}@db:5432/lawfive
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (see .env.example)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      API_URL: ${API_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-}
      SIGN_UP: ${SIGN_UP:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      ACCOUNT_STORAGE_LIMIT_MB: ${ACCOUNT_STORAGE_LIMIT_MB:-}
      S3_URL: ${S3_URL:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      MAP_STYLE_DARK_URL: ${MAP_STYLE_DARK_URL:-}
      MAP_STYLE_ATTRIBUTION: ${MAP_STYLE_ATTRIBUTION:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
      MAP_SATELLITE_URL: ${MAP_SATELLITE_URL:-}
      MAP_SATELLITE_ATTRIBUTION: ${MAP_SATELLITE_ATTRIBUTION:-}
      GEOCODER_URL: ${GEOCODER_URL:-}
      WEATHER_URL: ${WEATHER_URL:-}
      WEATHER_HISTORY_URL: ${WEATHER_HISTORY_URL:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_DAILY_LIMIT: ${WEATHER_DAILY_LIMIT:-}
    volumes:
      # Uploaded photos, unless S3_URL is set.
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lawfive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawfive}
      POSTGRES_DB: lawfive
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawfive -d lawfive"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  uploads:
