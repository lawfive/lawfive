[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
work = "2.12.0"
datastore = "1.3.0"
okhttp = "5.5.1"
serialization = "1.12.0"
coroutines = "1.11.0"
coil = "3.6.3"
maplibre = "13.7.1"
connectiq = "2.4.0"
exifinterface = "1.4.2"
# DEMO-9: Try a match on lawfive.app in the app's own browser view (Custom Tabs).
browser = "1.9.0"
codeScanner = "16.1.0"
firebaseMessaging = "26.0.1"
junit = "4.13.2"
# The snapshot tests (mobile/android/README.md#snapshot-tests): Robolectric with native graphics, and Roborazzi to
# write the pictures (both Apache 2.0); the fake server hands the screens the shared fixtures.
robolectric = "4.17"
roborazzi = "1.77.0"
# Newer than Compose's test library brings: 3.5 can't find Android 17's input manager.
espresso = "3.7.0"
wearOngoing = "1.1.0"
wearInput = "1.2.0"
healthServices = "1.1.0"
healthConnect = "1.1.0"
concurrentFutures = "1.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
play-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
connectiq = { module = "com.garmin.connectiq:ciq-companion-app-sdk", version.ref = "connectiq" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
wear-input = { module = "androidx.wear:wear-input", version.ref = "wearInput" }
health-services = { module = "androidx.health:health-services-client", version.ref = "healthServices" }
health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
concurrent-futures = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFutures" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
